<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <script src="edl.js"></script>
    <style>
      @font-face { font-family: "P5"; src: url("assets/fonts/poppins-latin-500-normal.woff2"); }
      @font-face { font-family: "P6"; src: url("assets/fonts/poppins-latin-600-normal.woff2"); }
      @font-face { font-family: "P7"; src: url("assets/fonts/poppins-latin-700-normal.woff2"); }
      @font-face { font-family: "P8"; src: url("assets/fonts/poppins-latin-800-normal.woff2"); }
      @font-face { font-family: "Anton"; src: url("assets/fonts/anton-latin-400-normal.woff2"); }
      @font-face { font-family: "Mono"; src: url("assets/fonts/jetbrains-mono-latin-600-normal.woff2"); }
      :root { --y: #ffd426; --ink: #14121a; --ok: #12a150; --bad: #e5383b; --blue: #1a73e8; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      body { font-family: "P7", sans-serif; color: var(--ink); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      .el { position: absolute; opacity: 0; }
      .center { left: 0; right: 0; display: flex; justify-content: center; }
      .pill { font-family: "P8"; font-size: 46px; color: var(--ink); background: #fff; padding: 12px 34px; border-radius: 60px; box-shadow: 0 14px 36px rgba(0,0,0,.35); white-space: nowrap; }
      .pill.dark { color: #fff; background: rgba(14,12,20,.9); }
      .pill b { color: var(--bad); } .pill.dark b { color: var(--y); }
      .glass { background: rgba(14,12,22,.88); border: 2px solid rgba(255,255,255,.12); border-radius: 34px; box-shadow: 0 30px 80px rgba(0,0,0,.45); color: #fff; }
      #prog { position: absolute; left: 0; top: 0; height: 10px; width: 0; background: linear-gradient(90deg, #ffd426, #ff7a00); z-index: 90; box-shadow: 0 0 18px rgba(255,170,0,.7); }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 80; }

      /* hook clip */
      #hk { top: 230px; flex-direction: column; align-items: center; gap: 16px; }
      #hk .big { font-family: "Anton"; font-size: 110px; line-height: 1; color: #fff; background: var(--bad); padding: 10px 40px 18px; border-radius: 30px; transform: rotate(-4deg); box-shadow: 0 24px 60px rgba(0,0,0,.45); white-space: nowrap; }
      #hk .arr { font-size: 110px; line-height: 1; filter: drop-shadow(0 8px 14px rgba(0,0,0,.4)); }

      /* talking take */
      #fall { top: 110px; }
      #fifteen { top: 1230px; flex-direction: column; align-items: center; gap: 8px; }
      #fifteen .n { font-family: "Anton"; font-size: 220px; line-height: .9; color: var(--y); text-shadow: 0 10px 0 rgba(0,0,0,.3), 0 20px 40px rgba(0,0,0,.5); }
      #fifteen .pill { font-size: 40px; }
      #day { top: 110px; }
      #day .tile { display: flex; align-items: center; gap: 24px; background: #fff; padding: 18px 34px; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,.4); }
      #day .num { font-family: "Anton"; font-size: 124px; line-height: .95; color: #fff; background: linear-gradient(135deg, #7c3aed, #c026d3); padding: 6px 30px 12px; border-radius: 24px; }
      #day .txt { font-family: "P8"; font-size: 46px; line-height: 1.08; }
      #day .txt small { display: block; font-family: "P6"; font-size: 28px; color: #6b6470; }
      #list15 { top: 1250px; }

      /* the 15 factors */
      /* full-screen list section: he is not shown while reading, only his voice + the list */
      #bgl { position: absolute; inset: 0; opacity: 0; background: radial-gradient(90% 60% at 50% 35%, #2b2350 0%, #120f1d 70%); overflow: hidden; }
      #bgl .glow { position: absolute; width: 900px; height: 900px; left: 90px; top: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(255,212,38,.16), rgba(255,212,38,0) 65%); }
      #bgl .gridl { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.04) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.04) 2px, transparent 2px); background-size: 90px 90px; }
      #bgl .hd { position: absolute; left: 0; right: 0; top: 130px; text-align: center; font-family: "P8"; font-size: 50px; color: #fff; }
      #bgl .hd b { color: var(--y); }
      #deck { position: absolute; left: 50px; right: 50px; top: 250px; height: 1300px; opacity: 0; }
      #dots { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: center; gap: 10px; }
      #dots i { width: 54px; height: 54px; border-radius: 12px; background: rgba(14,12,22,.82); color: rgba(255,255,255,.55); display: grid; place-items: center; font-style: normal; font-family: "Anton"; font-size: 30px; box-shadow: 0 6px 14px rgba(0,0,0,.3); }
      .card { position: absolute; left: 0; right: 0; top: 150px; height: 760px; padding: 44px 50px; opacity: 0; }
      .card .no { font-family: "Anton"; font-size: 200px; line-height: .85; color: var(--y); }
      .card .no small { font-size: 60px; color: rgba(255,255,255,.4); }
      .card .ic { position: absolute; right: 50px; top: 50px; font-size: 200px; line-height: 1; filter: drop-shadow(0 10px 18px rgba(0,0,0,.5)); }
      .card .t { font-family: "P8"; font-size: 76px; line-height: 1.08; margin-top: 40px; }
      .card .s { font-family: "P6"; font-size: 42px; line-height: 1.35; color: #cfcbe0; margin-top: 16px; }
      .bots { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
      .bots span { font-family: "Mono"; font-size: 36px; color: var(--ink); background: #fff; border-radius: 14px; padding: 6px 14px; opacity: 0; }
      .bots span b { color: var(--ok); }
      #save { top: 1270px; }
      #save .pill { font-size: 40px; }

      /* karaoke captions */
      #captions { position: absolute; left: 40px; right: 40px; top: 0; height: 100%; z-index: 60; }
      .cap { position: absolute; left: 0; right: 0; top: 1720px; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; opacity: 0;
             font-family: "P8"; font-size: 56px; line-height: 1.12; text-align: center; color: #fff; text-transform: uppercase; }
      .cap .w { display: inline-block; padding: 0 10px; border-radius: 14px;
                text-shadow: 0 4px 0 rgba(0,0,0,.55), 0 6px 18px rgba(0,0,0,.55), 3px 3px 0 #000, -3px 3px 0 #000, 3px -3px 0 #000, -3px -3px 0 #000; }
      .cap .hl { color: var(--y); }
      .cap .w.on { background: var(--y); color: var(--ink); text-shadow: none; box-shadow: 0 8px 20px rgba(0,0,0,.45); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="51.818" data-width="1080" data-height="1920">
      <section id="gfx" class="clip" data-start="0" data-duration="51.818" data-track-index="1">
        <div id="prog"></div>

        <!-- hook clip -->

        <!-- talking take -->
        <div class="el center" id="fall"><div class="pill dark">Is your website <b>falling</b> daily? 📉</div></div>
        <div class="el center" id="fifteen"><div class="n">15</div><div class="pill">things to fix 🛠️</div></div>
        <div class="el center" id="day"><div class="tile"><div class="num">DAY 12</div><div class="txt">Decoding<br />AI SEO<small>100-day series</small></div></div></div>
        <div class="el center" id="list15"><div class="pill dark">The <b>15 AI SEO</b> factors 👇</div></div>

        <!-- 15 factors -->
        <div id="bgl"><div class="gridl"></div><div class="glow"></div><div class="hd">🛠️ <b>15 things</b> for AI SEO</div></div>
        <div id="deck"><div id="dots"></div></div>
        <div class="el center" id="save"><div class="pill">💾 Save this checklist</div></div>
      </section>
      <div id="captions"></div>
    </div>

    <script>
      function T(x) { let acc = 0; for (const [a, b] of KEEP) { if (x < a) return acc; if (x <= b) return acc + x - a; acc += b - a; } return acc; }
      const HOOK = 61 / 30;
      const at = (x) => HOOK + T(x);
      window.T = T; window.at = at;
      const CUES = window.CUES = [];
      const tl = gsap.timeline({ paused: true });
      const DUR = 51.818;

      function buildCaptions() {
        const root = document.getElementById("captions");
        CUES.forEach(([start, end, ws]) => {
          const el = document.createElement("div");
          el.className = "cap";
          let on = false;
          const words = ws.map(([t, w]) => {
            const hl = on || w.startsWith("*");
            if (w.startsWith("*")) on = true;
            if (/\*[,?.!:"]*$/.test(w)) on = false;
            return { t, w: w.replace(/\*/g, ""), hl };
          });
          el.innerHTML = words.map((o) => `<span class="w${o.hl ? " hl" : ""}">${o.w}</span>`).join(" ");
          root.appendChild(el);
          tl.set(el, { opacity: 1 }, start);
          tl.fromTo(el, { scale: 0.86, y: 16 }, { scale: 1, y: 0, duration: 0.16, ease: "back.out(2.4)", immediateRender: false }, start);
          tl.set(el, { opacity: 0 }, end);
          const spans = [...el.querySelectorAll(".w")];
          spans.forEach((sp, k) => {
            const t0 = words[k].t, t1 = k + 1 < words.length ? words[k + 1].t : Math.min(end, t0 + 0.45);
            tl.set(sp, { className: "w on" + (words[k].hl ? " hl" : "") }, t0);
            tl.set(sp, { className: "w" + (words[k].hl ? " hl" : "") }, t1);
          });
        });
      }

      const out = (el, t, d = 0.2) => tl.to(el, { opacity: 0, scale: 0.9, duration: d, ease: "power2.in" }, t - d);
      const popIn = (el, t, from = {}) => tl.fromTo(el, { opacity: 0, scale: 0.5, y: 40, ...from }, { opacity: 1, scale: 1, y: 0, x: 0, rotation: 0, duration: 0.35, ease: "back.out(2.2)", immediateRender: false }, t);

      // [icon, title, sub-line, spoken at (original clock)]
      const F = [
        ["🧠", "Build entity SEO", "Make Google & AI know exactly who you are", 9.55],
        ["📰", "Run digital PR campaigns", "Get your brand on news & trusted sites", 10.83],
        ["🚀", "Leverage parasite SEO", "Publish on big, trusted platforms", 12.955],
        ["⭐", "Collect real, verified reviews", "Google, Trustpilot, G2 & more", 14.11],
        ["💬", "Be active on Reddit & forums", "Real answers, never spam", 17.732],
        ["🏆", "Get into \"best of\" listicles", "Top-10 lists AI loves to quote", 19.056],
        ["🎯", "Write direct answers", "Answer first, explain after", 21.376],
        ["📊", "Publish original data & research", "Numbers only you have", 23.48],
        ["📋", "Use lists & tables", "Structured content is easy to quote", 25.056],
        ["🧩", "Add complete schema markup", "Organization, FAQ, Product, Review", 29.586],
        ["🗣️", "Optimize for conversational prompts", "Write the way people ask ChatGPT", 31.395],
        ["▶️", "YouTube videos with clear transcripts", "AI reads what you say", 34.052],
        ["👨‍💼", "Strengthen author E-E-A-T", "Real experts, real bios", 35.555],
        ["🔄", "Keep facts & stats updated", "Fresh data = trusted data", 38.18],
        ["🤖", "Allow AI crawlers in robots.txt", "", 40.416],
      ];

      function build() {
        buildCaptions();
        tl.fromTo("#prog", { width: "0%" }, { width: "100%", duration: DUR - HOOK, ease: "none" }, HOOK);   // not over the hook clip

        // hook clip plays exactly as supplied: no text, no effects; the video starts when it ends

        // talking take
        tl.fromTo("#fall", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, at(0.3));
        tl.fromTo("#fifteen", { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, at(2.47));
        out(["#fall", "#fifteen"], at(3.58));
        tl.fromTo("#day", { opacity: 0, scale: 0.5, rotation: -6 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.4, ease: "back.out(1.8)" }, at(4.21));
        out("#day", at(7.7));
        tl.fromTo("#list15", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, at(7.79));
        out("#list15", at(9.5));

        // the 15 factors: each card swipes in on its name, a numbered tracker fills along the top
        const deck = document.getElementById("deck"), dots = document.getElementById("dots");
        dots.innerHTML = F.map((_, i) => `<i>${i + 1}</i>`).join("");
        const di = dots.querySelectorAll("i");
        // from the cut to the over-the-shoulder take (9.6 s) he is not shown: opaque background, voice + list only
        tl.fromTo("#bgl", { opacity: 0 }, { opacity: 1, duration: 0.15 }, at(9.6) - 0.15);
        tl.to("#bgl .glow", { scale: 1.15, x: 30, duration: 4, yoyo: true, repeat: 9, ease: "sine.inOut" }, at(9.6));
        tl.fromTo("#bgl .hd", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, at(9.6));
        tl.set(deck, { opacity: 1 }, at(9.5));
        tl.fromTo("#dots i", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.2, stagger: 0.03 }, at(9.5));
        F.forEach(([ic, t, sub, t0], i) => {
          const c = document.createElement("div");
          c.className = "card glass";
          const extra = i === 14 ? `<div class="bots"><span id="bt1"><b>✓</b> OAI-SearchBot</span><span id="bt2"><b>✓</b> PerplexityBot</span><span id="bt3"><b>✓</b> ClaudeBot</span><span id="bt4"><b>✓</b> Google-Extended</span></div>` : `<div class="s">${sub}</div>`;
          c.innerHTML = `<div class="no">${String(i + 1).padStart(2, "0")}<small>/15</small></div><div class="ic">${ic}</div><div class="t">${t}</div>${extra}`;
          deck.appendChild(c);
          const s = at(t0), e = i + 1 < F.length ? at(F[i + 1][3]) : DUR;
          tl.fromTo(c, { opacity: 1, x: 1100, rotation: 6 }, { opacity: 1, x: 0, rotation: 0, duration: 0.32, ease: "power3.out", immediateRender: false }, s - 0.06);
          tl.set(c, { opacity: 0 }, 0);
          tl.set(c, { opacity: 1 }, s - 0.06);
          tl.fromTo(c.querySelector(".ic"), { scale: 0.3, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2.6)", immediateRender: false }, s + 0.05);
          tl.to(di[i], { backgroundColor: "#ffd426", color: "#14121a", scale: 1.15, duration: 0.15 }, s);
          tl.to(di[i], { scale: 1, duration: 0.15 }, s + 0.2);
          if (i + 1 < F.length) tl.to(c, { x: -1100, rotation: -6, duration: 0.3, ease: "power3.in" }, e - 0.32);
        });
        [["#bt1", 44.85], ["#bt2", 46.05], ["#bt3", 47.09], ["#bt4", 47.83]].forEach(([b, t]) => popIn(b, at(t)));
        tl.fromTo("#save", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, at(48.6));
        tl.to("#save .pill", { scale: 1.06, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut" }, at(49.0));
        window.__timelines["main"] = tl;
      }
    </script>
    <script src="captions.js"></script>
    <script>document.fonts.ready.then(build);</script>
  </body>
</html>
