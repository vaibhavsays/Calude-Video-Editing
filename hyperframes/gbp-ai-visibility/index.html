<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <!--
      Graphics layer only. Rendered as a transparent MOV and laid over the
      talking-head footage by build.sh (the footage itself never goes through
      the browser). Times below are output-video seconds; keep them in sync
      with the constants at the top of build.sh.
    -->
    <style>
      @font-face {
        font-family: "Poppins";
        src: url("fonts/Poppins-normal-400.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Poppins";
        src: url("fonts/Poppins-normal-600.woff2") format("woff2");
        font-weight: 600;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("fonts/Montserrat-var.woff2") format("woff2");
        font-weight: 100 900;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      body {
        font-family: "Poppins", sans-serif;
      }

      /* Split screen: screen recording on top, speaker below (speaker comes from build.sh). */
      #panel {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 830px;
        overflow: hidden;
        background: #fbf3ee;
        opacity: 0;
      }
      .shot {
        position: absolute;
        left: 0;
        top: 0;
        width: 2560px;
        height: 1392px;
        transform-origin: 0 0;
      }
      .shot video {
        position: absolute;
        inset: 0;
        width: 2560px;
        height: 1392px;
      }
      #divider {
        position: absolute;
        left: 0;
        top: 826px;
        width: 1080px;
        height: 8px;
        background: #f08a24;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
        opacity: 0;
      }

      /* Full-screen "0% visibility" moment. */
      #zero {
        position: absolute;
        inset: 0;
        background: #fbf3ee;
        opacity: 0;
      }
      #zero-kicker {
        position: absolute;
        left: 0;
        width: 1080px;
        top: 560px;
        text-align: center;
        font-family: "Montserrat", sans-serif;
        font-weight: 900;
        font-size: 150px;
        line-height: 1;
        color: #d93a2b;
      }
      #zero-sub {
        position: absolute;
        left: 0;
        width: 1080px;
        top: 730px;
        text-align: center;
        font-weight: 600;
        font-size: 46px;
        color: #2a1a12;
      }
      #zero-card {
        position: absolute;
        left: 40px;
        top: 850px;
        width: 1000px;
        height: 229px;
        border-radius: 28px;
        overflow: hidden;
        background: #fff;
        box-shadow: 0 30px 70px rgba(80, 40, 20, 0.28);
      }
      #zero-card .shot {
        transform: scale(1.0417) translate(-790px, -615px);
      }

      /* Ending call to action over the blurred CTA clip. */
      #cta {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 34px;
      }
      #cta-comment {
        font-family: "Montserrat", sans-serif;
        font-weight: 800;
        font-size: 92px;
        letter-spacing: 6px;
        color: #fff;
        text-shadow: 0 6px 30px rgba(0, 0, 0, 0.45);
        opacity: 0;
      }
      #cta-pill {
        display: block;
        padding: 26px 86px 30px;
        border-radius: 34px;
        background: #c9561a;
        border: 6px solid #fff;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        font-family: "Montserrat", sans-serif;
        font-weight: 900;
        font-size: 190px;
        line-height: 1;
        letter-spacing: 8px;
        color: #fff;
        opacity: 0;
      }
      #cta-dm {
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 22px 40px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.95);
        font-weight: 600;
        font-size: 44px;
        color: #2a1a12;
        opacity: 0;
      }
      #cta-dm svg {
        width: 52px;
        height: 52px;
        flex: none;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="55.55" data-width="1080" data-height="1920">
      <div id="panel" data-layout-allow-overflow="true">
        <div class="shot" id="shot-0"><video id="shot-video-0" src="assets/broll_ai_tools.mp4" muted playsinline data-start="10.1" data-duration="5.50" data-media-start="6.0" data-playback-rate="1" data-track-index="2"></video></div>
        <div class="shot" id="shot-1"><video id="shot-video-1" src="assets/broll_ai_tools.mp4" muted playsinline data-start="15.6" data-duration="5.00" data-media-start="17.3" data-playback-rate="1" data-track-index="2"></video></div>
        <div class="shot" id="shot-2"><video id="shot-video-2" src="assets/broll_ai_tools.mp4" muted playsinline data-start="20.6" data-duration="5.80" data-media-start="22.5" data-playback-rate="2" data-track-index="2"></video></div>
        <div class="shot" id="shot-3"><video id="shot-video-3" src="assets/broll_report.mp4" muted playsinline data-start="26.4" data-duration="3.20" data-media-start="0.3" data-playback-rate="1" data-track-index="2"></video></div>
        <div class="shot" id="shot-4"><video id="shot-video-4" src="assets/broll_report.mp4" muted playsinline data-start="32.6" data-duration="3.00" data-media-start="5.6" data-playback-rate="1" data-track-index="2"></video></div>
        <div class="shot" id="shot-5"><video id="shot-video-5" src="assets/broll_report.mp4" muted playsinline data-start="35.6" data-duration="4.50" data-media-start="9.6" data-playback-rate="0.55" data-track-index="2"></video></div>
        <div class="shot" id="shot-6"><video id="shot-video-6" src="assets/broll_report.mp4" muted playsinline data-start="40.1" data-duration="3.50" data-media-start="12.0" data-playback-rate="1" data-track-index="2"></video></div>
        <div class="shot" id="shot-7"><video id="shot-video-7" src="assets/broll_report.mp4" muted playsinline data-start="43.6" data-duration="6.15" data-media-start="15.2" data-playback-rate="0.75" data-track-index="2"></video></div>
      </div>
      <div id="divider"></div>

      <div id="zero">
        <div id="zero-kicker">0%</div>
        <div id="zero-sub">on Google AI Mode &amp; ChatGPT</div>
        <div id="zero-card" data-layout-allow-overflow="true">
          <div class="shot">
            <video id="zero-video" src="assets/broll_report.mp4" muted playsinline data-start="29.6" data-duration="3" data-media-start="3.5" data-playback-rate="0.5" data-track-index="3"></video>
          </div>
        </div>
      </div>

      <div id="cta">
        <div id="cta-comment">COMMENT</div>
        <div id="cta-pill">TOOL</div>
        <div id="cta-dm">
          <svg viewBox="0 0 24 24" fill="none" stroke="#f08a24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13" /><path d="M22 2 15 22l-4-9-9-4 20-7z" /></svg>
          <span>I'll send you the link in your DMs</span>
        </div>
      </div>
    </div>

    <script>
      // Output-time constants (seconds). Mirror build.sh.
      const SPLIT_START = 10.1;
      const ZERO_START = 29.6;
      const ZERO_END = 32.6;
      const AROLL_END = 49.75;
      const CTA_SECOND_LINE = AROLL_END + 2.68; // "...comment TOOL" second phrase in the CTA clip

      // Each B-roll shot (the #shot-N markup above carries its timing): the crop window (centre x/y and width in source pixels) at the start and
      // end of the shot. The window keeps the panel's 1080x830 aspect.
      const SHOTS = [
        { src: "broll_ai_tools.mp4", start: 10.1, end: 15.6, media: 6.0, rate: 1, from: [1280, 700, 1400], to: [800, 950, 640], moveFor: 2.2 },
        { src: "broll_ai_tools.mp4", start: 15.6, end: 20.6, media: 17.3, rate: 1, from: [1120, 470, 780], to: [1100, 480, 700] },
        { src: "broll_ai_tools.mp4", start: 20.6, end: 26.4, media: 22.5, rate: 2, from: [1150, 620, 860], to: [1260, 860, 940] },
        { src: "broll_report.mp4", start: 26.4, end: 29.6, media: 0.3, rate: 1, from: [1270, 520, 1000], to: [1270, 680, 960] },
        { src: "broll_report.mp4", start: 32.6, end: 35.6, media: 5.6, rate: 1, from: [1170, 700, 780], to: [1380, 720, 780] },
        { src: "broll_report.mp4", start: 35.6, end: 40.1, media: 9.6, rate: 0.55, from: [1270, 740, 960], to: [1270, 860, 940] },
        { src: "broll_report.mp4", start: 40.1, end: 43.6, media: 12.0, rate: 1, from: [1270, 1000, 940], to: [1270, 1040, 880] },
        { src: "broll_report.mp4", start: 43.6, end: AROLL_END, media: 15.2, rate: 0.75, from: [1220, 880, 880], to: [1220, 980, 840] },
      ];

      const PANEL_W = 1080;
      const PANEL_H = 830;
      const tl = gsap.timeline({ paused: true });

      function framing([cx, cy, w]) {
        const s = PANEL_W / w;
        return { scale: s, x: PANEL_W / 2 - cx * s, y: PANEL_H / 2 - cy * s };
      }

      SHOTS.forEach((shot, i) => {
        const len = shot.end - shot.start;
        tl.fromTo("#shot-" + i, framing(shot.from), { ...framing(shot.to), duration: shot.moveFor || len, ease: shot.moveFor ? "power2.inOut" : "none" }, shot.start);
      });

      // Panel and divider on for the split section, off for the 0% moment and the ending.
      tl.set(["#panel", "#divider"], { opacity: 1 }, SPLIT_START);
      tl.set(["#panel", "#divider"], { opacity: 0 }, ZERO_START);
      tl.set(["#panel", "#divider"], { opacity: 1 }, ZERO_END);
      tl.set(["#panel", "#divider"], { opacity: 0 }, AROLL_END);
      tl.fromTo("#divider", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, SPLIT_START);

      // 0% moment.
      tl.set("#zero", { opacity: 1 }, ZERO_START);
      tl.set("#zero", { opacity: 0 }, ZERO_END);
      tl.fromTo("#zero-kicker", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, ZERO_START + 0.05);
      tl.fromTo("#zero-sub", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, ZERO_START + 0.25);
      tl.fromTo("#zero-card", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, ZERO_START + 0.4);

      // Ending CTA.
      tl.fromTo("#cta-comment", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, AROLL_END + 0.15);
      tl.fromTo("#cta-pill", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2.2)" }, AROLL_END + 0.3);
      tl.to("#cta-pill", { scale: 1.06, duration: 0.18, yoyo: true, repeat: 1, ease: "power1.inOut" }, CTA_SECOND_LINE);
      tl.fromTo("#cta-dm", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, CTA_SECOND_LINE + 0.2);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
